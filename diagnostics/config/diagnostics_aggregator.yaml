diagnostics_aggregator:
  ros__parameters:
    pub_rate: 1.0
    base_path: Robot

    analyzers:
      sensors:
        type: diagnostic_aggregator/AnalyzerGroup
        path: Sensors

        analyzers:
          lidar:
            type: diagnostic_aggregator/GenericAnalyzer
            path: LiDAR
            contains:
              - urg_node

          imu:
            type: diagnostic_aggregator/GenericAnalyzer
            path: IMU
            contains:
              - imu
              - IMU