particle_filter:
  ros__parameters:
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/odom'
    # range data downsampling
    angle_step: 15
    max_particles: 4000
    squash_factor: 4.2 # default 2.2
    # visualization
    viz: 1
    max_viz_particles: 60
    
    # ray marching method
    range_method: 'cddt'

    # Method | Init time (sec) | Random Queries/Sec | Grid Queries/Sec | Memory (MB)
    # BL     | 0.02            | 297,000            | 360,000          | 1.37
    # RM     | 0.59            | 1,170,000          | 1,600,000        | 5.49
    # RMGPU  | 0.68            | 18,000,000         | 28,000,000       | 5.49
    # CDDT   | 0.25            | 2,090,000          | 4,250,000        | 6.34
    # PCDDT  | 7.96            | 2,260,000          | 4,470,000        | 4.07
    # LUT    | 64.5            | 2,160,000          | 4,850,000        | 296.6

    theta_discretization: 112 # Higher number -> more precise, way higher compute
    # range data filtering
    max_range: 10
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    z_short: 0.01 # % Unexpected objects (e.g. people, other robots)
    z_max: 0.07 # % Failure to detect anything
    z_rand: 0.12 # % Noise
    z_hit: 0.75 # % actual wall hits
    sigma_hit: 8.0 # Measurement noise: Higher value -> more forgiving for map errors
    # motion model dispersion constants
    motion_dispersion_x: 0.5 #default 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2

map_server:
  ros__parameters:
    # assuming map file is in arc_riders/launch_orchestrator/maps
    map: 'MAP_NAME_HERE'
