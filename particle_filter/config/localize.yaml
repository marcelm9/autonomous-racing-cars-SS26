particle_filter:
  ros__parameters:
    scan_topic: '/scan'
    odometry_topic: '/odom'
    max_particles: 2000
    angle_step: 16
    max_viz_particles: 60
    viz: 1
    range_method: 'cddt'
    theta_discretization: 112
    rangelib_variant: 2
    max_range: 25.0
    squash_factor: 2.2
    fine_timing: 0
    publish_odom: 1
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.07
    z_hit: 0.8
    sigma_hit: 8.0
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
