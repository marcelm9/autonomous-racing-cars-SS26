diagnostics_aggregator:
  ros__parameters:
    pub_rate: 1.0
    base_path: Robot

    analyzers:
      sensors:
        type: diagnostic_aggregator/AnalyzerGroup
        path: diagnostics
        analyzers:
          lidar:
            type: diagnostic_aggregator/GenericAnalyzer
            path: LiDAR
            contains:
              - urg_node
      safety:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Safety
        contains:
          - safety_node