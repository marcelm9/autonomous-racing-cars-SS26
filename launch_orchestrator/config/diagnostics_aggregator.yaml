diagnostics_aggregator:
  pub_rate: 1.0 # Optional
  base_path: '' # Optional, prepended to all diagnostic output
  analyzers:
    sensor:
      type: AnalyzerGroup
      path: diagnostics
        analyzers: 
          imu:
            type: GenericAnalyzer
            path: IMU
            timeout: 5.0
            find_and_remove_prefix: imu_node
            num_items: 3
