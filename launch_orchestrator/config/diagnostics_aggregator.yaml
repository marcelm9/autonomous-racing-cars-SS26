diagnostics_aggregator:
  ros__parameters:
    pub_rate: 1.0
    base_path: Robot

    analyzers:
      sensors:
        type: diagnostic_aggregator/AnalyzerGroup
        path: Sensors
        analyzers:
          imu:
            type: diagnostic_aggregator/GenericAnalyzer
            path: IMU
            contains:
              - IMU

      safety:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Safety
        contains:
          - Emergency Brake